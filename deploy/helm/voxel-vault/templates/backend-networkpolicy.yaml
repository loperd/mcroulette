{{- if and .Values.gateway.enabled .Values.gateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voxel-vault.fullname" . }}-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxel-vault.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "voxel-vault.name" . }}-gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}
