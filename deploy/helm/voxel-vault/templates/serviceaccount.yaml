{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "voxel-vault.serviceAccountName" . }}
  labels:
    {{- include "voxel-vault.labels" . | nindent 4 }}
# The API never calls the kube-API: no token in the pod. Vault's Kubernetes auth logs in as this
# account through VSO, which requests its own short-lived token (TokenRequest), not the pod's.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}
